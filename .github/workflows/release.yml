name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the wheel and sdist with the admin page inside,
# checks them, then publishes them to PyPI and the Docker image to ghcr.io.
# Run it by hand ("Run workflow") to build and check everything without publishing.
#
# One-time setup before the first publish (see docs/maintainers.md):
# - PyPI: add a trusted publisher for project hydra-mcp, repository lambi702/hydra-mcp,
#   workflow release.yml, environment pypi. No API token is stored anywhere.
# - GitHub: create the environment "pypi" (Settings > Environments), ideally with a required
#   reviewer so every publish waits for a click.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: Build and check the Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: The tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -m1 '^version' proxy/pyproject.toml | cut -d'"' -f2)
          init=$(grep -m1 '__version__' proxy/src/hydra_mcp/__init__.py | cut -d'"' -f2)
          test "$TAG" = "v$version" && test "$version" = "$init" \
            || { echo "tag $TAG, pyproject $version, __init__ $init: bump both first"; exit 1; }
      - run: cd admin && npm ci
      - run: make package
      - run: scripts/check-dist.sh proxy/dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: proxy/dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: dist
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hydra-mcp/
    permissions:
      id-token: write # trusted publishing (OIDC), no stored token
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  docker:
    name: Docker image (ghcr.io)
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name != 'release' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
