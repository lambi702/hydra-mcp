version: 2
updates:
  - package-ecosystem: uv
    directory: /proxy
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
    labels: ["dependencies"]
  - package-ecosystem: npm
    directory: /admin
    schedule: { interval: weekly }
    groups:
      admin:
        patterns: ["*"]
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: ["dependencies"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: ["dependencies"]
